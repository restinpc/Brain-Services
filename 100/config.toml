[service]
id = 100
port = 8963
name = "brain-gdelt-news-regimes-ml-s100"
text = "GDELT CAMEO, news tone, economic themes and causal news-volume regimes with ML/reverse-learning"

[rates]
table = "brain_rates_eur_usd"

[cache]
date_from = "2025-01-01"
var_range = [0, 1, 2, 3]
types_range = [0, 1, 2, 3, 4]
param_range = [""]
shift_window = 12
reload_interval = 3600
rebuild_interval = 7200
ml_workers = 2
ml_batch_size = 2000
batch_model_size = 1000

[dataset]
parser_table = "sasha_gdelt_news"
# GDELT.py writes to DB_* by default; brain selects MASTER_* instead.
source_engine = "vlad"
enriched_table = "sasha_gdelt_regimes_s100"
index_fields = ["event_type"]
date_field = "date_dt"
engine = "vlad"
filter_by_date = true
key_field = "event_type"
model_can_filter = true
model_uses_rates = false

[ctx]
key_columns = ["id"]

[model]
# Historical provider batch time; first_seen also waits for loaded_at.
# Never replace missing available_at with an event/publication/ingestion date.
availability_mode = "provider_time"
publication_lag_minutes = 0
neutral_tone = 1.0
strong_tone = 5.0
min_mention_confidence = 40.0
baseline_days = 30
baseline_min_hours = 24
volume_elevated = 2.0
volume_extreme = 4.0
min_analogs = 8
history_days = 730
extremum_prior = 4.0
rare_occurrence_max = 0

# Optional overrides, e.g. [model.theme_families] / inflation = ["ECON_INFLATION", "WB_442"].
# An empty list disables that family. Defaults and their mapping live in model.py.

[ml]
enabled = true
init_mode = "constant"
target_precision = 0.95
max_iter = 20
step = 0.10
extremum_limit = 50
active_tail = 0
precision_metric = "mean"
