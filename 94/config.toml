[service]
id = 94
port = 8957
name = "brain-polymarket-pressure-ml-s94"
text = "Polymarket prediction-market probability pressure: causal H1/H6/H24 repricing + cross-market breadth + ML/reverse-learning"

[rates]
table = "brain_rates_eur_usd"

[cache]
date_from = "2026-03-01"
var_range = [0, 1, 2, 3]
types_range = [0, 1, 2, 3, 4]
param_range = [""]
shift_window = 48
reload_interval = 3600
rebuild_interval = 7200
ml_workers = 2
ml_batch_size = 2000
batch_model_size = 1000

[dataset]
parser_table = "vlad_polymarket"
markets_table = "vlad_polymarket_markets"
prices_table = "vlad_polymarket_prices"
enriched_table = "vlad_polymarket_pressure_events_s94"
map_table = "vlad_polymarket_market_map_s94"
state_table = "vlad_polymarket_pressure_state_s94"
index_fields = ["event_type"]
date_field = "date_dt"
engine = "vlad"
filter_by_date = true
key_field = "event_type"
model_can_filter = true

[model]
# Historical price itself is causal.  Other columns in the legacy price table
# (volume/liquidity/spread/outcome_yes/outcome_no) are deliberately ignored:
# the parser copied current Gamma metadata backwards onto historical rows.
chunk_days = 7
context_hours = 30
min_family_signatures = 3
h1_min_move = 0.02
h6_min_move = 0.04
h24_min_move = 0.07
large_move = 0.07
extreme_move = 0.15
pressure_small = 0.015
pressure_large = 0.03
breadth_threshold = 0.35
shock_move = 0.05
shock_share = 0.25
uncertainty_delta = 0.05

[ml]
enabled = true
init_mode = "constant"
target_precision = 0.95
max_iter = 20
step = 0.10
extremum_limit = 50
active_tail = 0
precision_metric = "mean"
