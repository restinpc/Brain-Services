# Service configuration for the Euro-area monetary-supply model.

[service]
id = 74
port = 8945
name = "brain-sasha_ecb_money_supply-s74"
text = "ECB currency-in-circulation and M3 context model"

[rates]
table = "brain_rates_eur_usd"

[cache]
date_from = "2025-01-01"
var_range = [0, 1, 2, 3]
types_range = [0, 1, 2]
param_range = ["emission", "m3"]
shift_window = 30
rebuild_interval = 7200

[dataset]
parser_table = "sasha_ecb_emission"
parser_table_2 = "sasha_ecb_m3"
enriched_table = "sasha_ecb_money_supply_enriched"
index_fields = ["event_type"]
date_field = "date_dt"
engine = "vlad"
model_can_filter = true

[ctx]
key_columns = ["id"]

[ml]
enabled = false
target_precision = 0.95
max_iter = 20
step = 0.10
extremum_limit = 50
