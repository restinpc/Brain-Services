[service]
id = 64
port = 8926
name = "brain-news-structured-h1-ml-s64"
text = "Structured financial news events + causal story lifecycle + H1 reverse-learning"

[rates]
table = "brain_rates_eur_usd"

[cache]
date_from = "2025-01-15"
fresh_lag_days = 14
var_range = [0, 1, 2, 3, 4, 5]
types_range = [0, 1, 2, 3, 4]
shift_window = 4
reload_interval = 1800
# Keep automatic rebuild disabled: framework /rebuild_index updates DB/indexes,
# but the in-memory dataset becomes current only after /reload.
rebuild_interval = 0
ml_workers = 1
ml_batch_size = 2000

[dataset]
enriched_table = "vlad_news_structured_events_v2"
index_fields = ["event_type"]
date_field = "date_dt"
engine = "vlad"
filter_by_date = true
key_field = "event_type"
model_can_filter = true
model_uses_rates = true

[ctx]
key_columns = ["id"]

[model]
rare_occurrence_max = 0

[ml]
enabled = true 
init_mode = "constant"
target_precision = 0.62
max_iter = 8
step = 0.04
extremum_limit = 48
active_tail = 0
precision_metric = "mean"
