# Service configuration for sasha_us_treasury_debt_to_penny model.

[service]
id = 85
port = 8947
name = "brain-sasha_us_treasury_debt_to_penny-ml-s85"
text = "U.S. Treasury debt-to-the-penny fiscal regime model with ML/reverse-learning"

[cache]
date_from = "2025-01-01"
# Reverse-learning axes: train mode and extremum detection interval.
var_range = [3, 5, 7, 9]
types_range = [0, 1, 2, 3, 4]
shift_window = 30
rebuild_interval = 7200

[dataset]
parser_table = "sasha_us_treasury_debt_to_penny"
enriched_table = "sasha_us_treasury_debt_to_penny_enriched"
index_fields = ["event_type"]
date_field = "date_dt"
engine = "vlad"

[ctx]
key_columns = ["id"]

[ml]
enabled = true
init_mode = "constant"
target_precision = 0.95
max_iter = 20
step = 0.10
extremum_limit = 50
active_tail = 0
precision_metric = "mean"
